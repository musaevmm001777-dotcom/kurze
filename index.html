<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Домашние Полуфабрикаты</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f5f5f5);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #222222);
      --hint-color: var(--tg-theme-hint-color, #888888);
      --btn-color: var(--tg-theme-button-color, #2aeee9);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
    }
    .screen { display: none; }
    .screen.active { display: block; }
    
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .card-title { font-weight: bold; font-size: 16px; margin-bottom: 4px; }
    .card-info { font-size: 12px; color: var(--hint-color); margin-bottom: 8px; }
    .controls { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    
    button {
      background-color: var(--btn-color);
      color: var(--btn-text);
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }
    .footer-btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      margin-top: 10px;
    }
    .counter { display: flex; align-items: center; gap: 8px; }
    .counter span { font-weight: bold; }
  </style>
</head>
<body>

  <!-- Экран 1: Каталог -->
  <div id="catalog-screen" class="screen active">
    <h2>🍽 Каталог</h2>
    <div id="product-list"></div>
    <button class="footer-btn" onclick="goToCheckout()">Перейти к оформлению (<span id="cart-total">0</span> ₽)</button>
  </div>

  <!-- Экран 2: Оформление -->
  <div id="checkout-screen" class="screen">
    <h2>📋 Оформление заказа</h2>
    
    <label>Номер телефона:</label>
    <input type="tel" id="phone" placeholder="+7 (999) 000-00-00">

    <label>Способ получения:</label>
    <select id="delivery-type" onchange="toggleDeliveryFields()">
      <option value="delivery">Доставка</option>
      <option value="pickup">Самовывоз</option>
    </select>

    <div id="delivery-block">
      <label>Адрес доставки:</label>
      <input type="text" id="address" placeholder="Улица, дом, квартира">
    </div>

    <div id="pickup-block" style="display: none;">
      <label>Выберите пункт самовывоза:</label>
      <select id="pickup-point">
        <option value="Адрес 1: ул. Ленина 10">ул. Ленина 10</option>
        <option value="Адрес 2: ул. Мира 25">ул. Мира 25</option>
      </select>
    </div>

    <label>Способ оплаты:</label>
    <select id="payment">
      <option value="cash">Наличными</option>
      <option value="card">Картой</option>
    </select>

    <button class="footer-btn" onclick="goToConfirmation()">Проверить заказ</button>
    <button style="background: #ccc; margin-top: 8px;" class="footer-btn" onclick="showScreen('catalog-screen')">Назад</button>
  </div>

  <!-- Экран 3: Подтверждение -->
  <div id="confirm-screen" class="screen">
    <h2>🔍 Проверка заказа</h2>
    <div id="summary-card" class="card"></div>
    <button class="footer-btn" onclick="submitOrder()">Подтвердить заказ</button>
    <button style="background: #ccc; margin-top: 8px;" class="footer-btn" onclick="showScreen('checkout-screen')">Назад</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
